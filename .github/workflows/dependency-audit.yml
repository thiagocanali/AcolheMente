name: Dependency audit

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-audit.yml"
      - "scripts/report-audit.mjs"
      - "tests/audit-report.test.mjs"
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Report dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update npm to a peer-resolution bugfix release
        run: npm install --global npm@11.6.2
      - name: Install dependencies
        run: npm ci
      - name: Preserve committed lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: audited-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Generate audit report
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=moderate --json > npm-audit.json
      - name: Preserve audit report for review
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: error
      - name: Validate and summarize audit report
        run: node scripts/report-audit.mjs npm-audit.json
      - name: Enforce npm audit exit status
        if: steps.audit.outcome != 'success'
        run: exit 1
