name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update npm to a peer-resolution bugfix release
        run: npm install --global npm@11.6.2
      - name: Install dependencies
        run: npm install
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Component tests
        run: npm run test
      - name: Typecheck and build
        run: npm run build
